apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: tcp
      port: {{ .Values.tcpPort }}
      targetPort: tcp
      protocol: TCP
    - name: admin
      port: {{ .Values.healthPort }}
      targetPort: health
      protocol: TCP
  selector:
    app.kubernetes.io/name: apple-tv-bridge
    app.kubernetes.io/instance: {{ .Release.Name }}
